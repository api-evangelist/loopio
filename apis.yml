aid: loopio
name: Loopio
description: Loopio is a Toronto-based response management platform used by teams to answer RFPs, RFIs,
  DDQs, and security questionnaires from a governed, reusable content Library. It publishes a public REST
  API — the Loopio Public API v2 at https://api.loopio.com/data/v2 — documented on a Stoplight developer
  portal at developer.loopio.com, with a 96-operation OpenAPI 3.0.1 contract covering Library Entries,
  Projects, Project Entries, Sections and subSections, Custom Project Fields, Merge Variables, Compliance
  Sets, Project Templates, Stacks, Tags, Teams, Users, Roles, Files, CRM opportunity links, asynchronous
  task status, and webhook subscriptions. Authentication is OAuth 2.0 client credentials against https://api.loopio.com/oauth2/access_token
  with 22 in-spec scopes, and the authorization server publishes RFC 8414 and RFC 9728 discovery documents
  that advertise a wider 51-scope surface including SCIM user/group provisioning and MCP tool/prompt/resource
  scopes.
