apis:
- aid: loopio-public-api-v2
  name: Loopio Public API v2
  description: The Loopio Public API v2 is a REST API over the Loopio response management platform. It
    exposes the Library (entries, attachments, history, stacks, tags), Projects (entries, sections, subSections,
    participants, source documents, compliance sets, custom fields, merge variables, templates), Users,
    Teams and Roles, Files, CRM opportunity links, asynchronous task polling, and webhook subscriptions
    for libraryEntry.updated, libraryReview.assigned, project.created and project.statusChanged.
