gaps:
- No event payload schema is published in the OpenAPI — the payload shape is described only in
  the Loopio help centre, which is behind a Cloudflare bot challenge for automated clients
  (https://support.loopio.com/hc/en-us/articles/4404035409555-What-Information-is-in-a-Webhook-Event-Notification-
  returned HTTP 403 to this probe).
- No retry policy, backoff schedule, delivery-guarantee statement or dead-letter behaviour is published.
- The event catalog is closed and small — 4 events against 96 REST operations, with no events at all
  for Users, Teams, Merge Variables, Custom Project Fields, Files or Project Entries.
