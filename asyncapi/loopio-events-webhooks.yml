asyncapi_note: >-
  Loopio publishes no AsyncAPI document. It does ship a real, first-party webhook surface,
  fully modelled inside the REST contract — subscription CRUD operations, a closed
  SubscribableEvent enum, HMAC signature headers and a signing-secret rotation endpoint —
  so this artifact captures the event catalog and carries a Webhooks pointer rather than a
  fabricated AsyncAPI spec.
surface: webhooks
transport: HTTPS POST to a subscriber-supplied callback URL
delivery: at-least-once (not stated by the provider; no delivery guarantee is published)
subscription_model:
  managed_via: Loopio Public API v2
  base_url: https://api.loopio.com/data/v2
  resource: /webhookSubscriptions
  operations:
  - operationId: listWebhookSubscriptions
    method: GET
    path: /webhookSubscriptions
    scope: webhook:read
  - operationId: createWebhookSubscription
    method: POST
    path: /webhookSubscriptions
    scope: webhook:write
  - operationId: getWebhookSubscription
    method: GET
    path: /webhookSubscriptions/{subscriptionId}
    scope: webhook:read
  - operationId: updateWebhookSubscription
    method: PUT
    path: /webhookSubscriptions/{subscriptionId}
    scope: webhook:write
  - operationId: cancelWebhookSubscription
    method: DELETE
    path: /webhookSubscriptions/{subscriptionId}
    scope: webhook:delete
  - operationId: refreshWebhookSigningSecret
    method: POST
    path: /webhookSubscriptions/{subscriptionId}/signingSecret
    scope: webhook:write
  subscription_schema:
    id: integer
    webhookUrl: 'string (uri, must match ^https://)'
    events: array of SubscribableEvent, minItems 1
    status: PENDING | ACTIVE | DISABLED
    creator: '{ id: integer }'
  url_validation: >-
    Loopio validates the callback URL automatically as part of the create request; the
    subscription starts in PENDING and moves to ACTIVE once validation succeeds.
    Reference: https://support.loopio.com/hc/en-us/articles/4404035824147-How-Do-I-Validate-My-Webhook-URL-
security:
  signing: HMAC over the JSON-encoded request body using the subscription's signing secret
  headers:
  - name: X-Loopio-Content-Signature
    required: true
    description: The JSON-encoded body of the request, hashed with the webhook's signing secret
  - name: X-Loopio-Request-Timestamp
    required: true
    type: integer
    description: Timestamp of when the request was sent (replay-window material)
  secret_rotation:
    operationId: refreshWebhookSigningSecret
    path: /webhookSubscriptions/{subscriptionId}/signingSecret
    note: A first-party rotation endpoint — the secret can be rolled without recreating the subscription.
