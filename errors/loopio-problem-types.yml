error_names:
- name: FATAL_ERROR
  meaning: An unhandled server-side failure.
  remediation: Retry with backoff; quote debugId to Loopio support if it persists.
- name: FORBIDDEN
  meaning: The access token does not carry the scope the operation requires.
  remediation: Create an App with the required scope, or request a token whose scope parameter includes it. Scopes
    cannot be added to an existing App.
- name: INVALID_REQUEST
  meaning: The request was malformed or a parameter failed validation.
  remediation: Fix the request body or query parameters and retry.
- name: NO_PERMISSION
  meaning: The authenticated principal lacks permission on the target resource.
  remediation: Check the Loopio role and Library/Project permissions of the account behind the App.
- name: RESOURCE_NOT_FOUND
  meaning: The addressed resource does not exist or is not visible to this client.
  remediation: Verify the id; a 404 is also returned where a resource exists but is out of scope for the client.
- name: UNPROCESSABLE_REQUEST
  meaning: The request was well-formed but cannot be applied in the current state.
  remediation: Resolve the state conflict described in message and retry.
- name: VALIDATION_ERROR
  meaning: A field in the request body failed a validation rule.
  remediation: Correct the named field; the message identifies it.
