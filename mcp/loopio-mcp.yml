  evidence_of_an_mcp_surface: true
  detail: 'Loopio''s own OAuth 2.0 authorization server advertises three MCP scopes — mcp.tools:all, mcp.prompts:all
    and mcp.resources:all — in both its RFC 8414 metadata (https://api.loopio.com/.well-known/oauth-authorization-server,
    HTTP 200) and its RFC 9728 protected-resource metadata (https://api.loopio.com/.well-known/oauth-protected-resource,
    HTTP 200). That is a first-party declaration that Loopio operates an MCP surface behind this authorization
    server. No endpoint for it is published or discoverable: POST tools/list was probed against api.loopio.com/mcp,
    /mcp/, /mcp/v1, /v1/mcp, /mcp/sse, /mcp/messages, /sse, /ai/mcp, /data/v2/mcp, api.eu.loopio.com/mcp, mcp.loopio.com/
    and mcp.loopio.com/sse and every one returned HTTP 404 from the Loopio application shell. Loopio serves
    customers on per-tenant subdomains, so a tenant-scoped MCP endpoint would not be reachable without a customer
    account. No MCPServer pointer is emitted, because no server was verified — the scopes are recorded as the
    finding, not as the surface.'
