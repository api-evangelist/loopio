gaps:
- No self-serve developer sandbox. An integrator cannot obtain a working Loopio API credential
  without an existing Loopio subscription and an Admin who creates the App.
- No public API console or "try it" surface that answers anonymously.
pointer:
  emitted: false
  reason: >-
    No Sandbox pointer is wired into apis.yml. The int01 environment is real and documented but
    is provisioned by Loopio to existing customers only, and the Stoplight mock refuses
    anonymous calls, so there is no sandbox or console a developer can reach from the public
    site. Emitting the pointer would credit Loopio with a self-serve trial surface it does not
    offer.
