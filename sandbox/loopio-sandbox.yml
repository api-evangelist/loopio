  platform: Stoplight Prism
  anonymous: false
  probe:
    url: https://stoplight.io/mocks/loopio/loopio-api/84330/stacks
    status: 401
    body: >-
      Prism UNAUTHORIZED — "Your request does not fullfil the security requirements and no HTTP
