notes: >-
  Two real documents were served, both by the API host api.loopio.com: an RFC 8414 OAuth
  2.0 Authorization Server Metadata document and an RFC 9728 OAuth 2.0 Protected Resource
  Metadata document. They are the most information-dense artifacts Loopio publishes
  anonymously — between them they name the token, authorization and issuer endpoints,
  the supported grants (authorization_code, refresh_token, client_credentials), PKCE
  S256, the three client authentication methods, and a 47-scope surface that is
  materially WIDER than the 22 scopes the published OpenAPI declares (it adds SCIM
  user/group provisioning, Microsoft Dynamics, Salesforce, Zendesk, unified answers,
  pitch partner, metrics and mcp.tools/mcp.prompts/mcp.resources scopes).
  developer.loopio.com is a Stoplight Elements single-page app whose catch-all answers
  HTTP 200 with the same ~443KB HTML shell for EVERY /.well-known/* path and for
  /llms.txt — a control probe of a deliberately invented path returned an identical 200,
  so none of those are documents and none are recorded as hits.
  loopio.com and www.loopio.com sit behind a Sucuri "sgcaptcha" robot challenge that
  answers HTTP 202 with a 190-byte meta-refresh interstitial for every path.
